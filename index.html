<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css" type="text/css">
    <script src="./main.js" defer></script>
    <title>Document</title>
</head>

<body>
    <h1 class="title">Welcome to Rami's Library</h1>

    <div class="container">

        <div class="card addbook">
            <form id="book-form">

                <div class="col">
                    <label for="title">Book's Title</label>
                    <input name="title" type="text" id="title" minlength="2" maxlength="40"
                        placeholder="40 Rules of Power" required>
                </div>

                <div class="col">
                    <label for="author">Book's Author</label>
                    <input name="author" type="text" id="author" minlength="2" maxlength="40" placeholder="C.S. Lewis"
                        required>
                </div>

                <div class="col">
                    <label for="pages">Number of Pages</label>
                    <input name="pages" type="number" id="pages" max="10000" min="0" placeholder="100" required>
                </div>

                <div class="col">
                    <label for="publication">Publication Date</label>
                    <input type="number" id="publication" name="publication" min="600" max="2028" placeholder="2026"
                        required>
                </div>

                <div class="col">
                    <p>Has Been Read?</p>

                    <div class="radio-row">
                        <label for="read">Yes</label>
                        <input type="radio" id="read" name="read" value="true" required>
                    </div>

                    <div class="radio-row">
                        <label for="unread">No</label>
                        <input type="radio" id="unread" name="read" value="false">
                    </div>
                </div>

                <button type="submit">
                    Add Book
                </button>

            </form>
        </div>

        <div class="card displaybook">

            <button class="displayBtn">
                Display Books
            </button>

            <div class="system-log"></div>

        </div>

    </div>
</body>

</html>
